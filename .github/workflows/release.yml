name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): no long-lived tokens.
# One-time setup (maintainer): add this repo/workflow/environment as a trusted publisher on PyPI and
# TestPyPI, and create the protected environments `testpypi` and `pypi` (required reviewer on `pypi`).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/src/mcp_schema_bridge/_version.py)
          test "v$v" = "${GITHUB_REF_NAME}"
      - name: Release gates
        working-directory: python
        env:
          MSB_RELEASE: "1"
        run: |
          uv sync --locked
          uv run pytest -q --cov=mcp_schema_bridge.core --cov-fail-under=95
      - run: uv run --script scripts/sync_rules.py --check
      - run: uv run --script scripts/gen_matrix.py --check
      - run: uv run --script scripts/check_package_contents.py
      - run: uv run --script scripts/smoke_installed.py
      - run: uv build --out-dir dist python
      - name: SBOM (CycloneDX)
        working-directory: python
        run: uv export --format cyclonedx1.5 --preview-features sbom-export --no-dev --frozen > ../dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
    permissions:
      id-token: write       # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: rm -f dist/sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true    # PEP 740
          skip-existing: true   # idempotent re-runs after a partial publish

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with artifacts and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
