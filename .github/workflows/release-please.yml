name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # dispatch the publishing workflows below
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A tag pushed with GITHUB_TOKEN does not trigger `on: push: tags`, so start the publishing
      # workflows explicitly (workflow_dispatch is allowed). They run at the tag ref, so trusted
      # publishing sees release.yml / release-npm.yml as the top-level workflow.
      - name: Publish the release
        if: steps.release.outputs['python--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs['python--tag_name'] }}
        run: |
          gh workflow run release.yml --ref "$TAG" -f repository=pypi
          gh workflow run release-npm.yml --ref "$TAG"
