[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-schema-bridge"
dynamic = ["version"]
description = "Normalize MCP tool schemas for Gemini, OpenAI and Anthropic, with a lossiness report and argument round-trip."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The mcp-schema-bridge Authors" }]
keywords = ["mcp", "model-context-protocol", "json-schema", "gemini", "openai", "anthropic", "function-calling", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vickyonit/mcp-schema-bridge"
Issues = "https://github.com/vickyonit/mcp-schema-bridge/issues"

[project.optional-dependencies]
sdks = ["google-genai>=1.30", "openai>=1.99", "anthropic>=0.60"]
cli = ["mcp>=1.12"]

[project.scripts]
mcp-schema-bridge = "mcp_schema_bridge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "jsonschema>=4.23",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[tool.hatch.version]
path = "src/mcp_schema_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_schema_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = ["live: calls real provider APIs (needs keys)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["SIM300"]  # false positives on UPPER_CASE module constants

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
